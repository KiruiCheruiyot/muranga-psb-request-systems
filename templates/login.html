{% extends "base.html" %}{% block title %}Sign in | Murang'a PSB{% endblock %}
{% block content %}
<section class="form-wrap"><div class="form-intro"><span class="eyebrow">WELCOME BACK</span><h1>Sign in to your portal</h1><p>Access your submitted requests and status updates.</p></div>
<form method="post" class="panel">
<label>Email address<input type="email" name="email" autocomplete="email" required></label>
<label>Password<input type="password" name="password" autocomplete="current-password" required></label>
<button class="button primary full" type="submit">Sign in</button><p class="form-foot">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
</form></section>
{% endblock %}
